# Pings /api/health every 2 days so the free Supabase project is never paused for inactivity.
# Repo settings -> Secrets and variables -> Actions:
#   Variable HEALTH_URL    e.g. https://your-site.example.com/api/health
#   Secret   HEALTH_TOKEN  (optional) must match HEALTH_TOKEN in the app's env
name: keep-alive

on:
  schedule:
    - cron: "17 5 */2 * *" # every 2 days, 05:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: |
          if [ -z "$HEALTH_URL" ]; then echo "HEALTH_URL variable is not set"; exit 1; fi
          if [ -n "$HEALTH_TOKEN" ]; then
            curl -fsS --retry 3 --retry-delay 10 --max-time 30 -H "Authorization: Bearer $HEALTH_TOKEN" "$HEALTH_URL"
          else
            curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$HEALTH_URL"
          fi
